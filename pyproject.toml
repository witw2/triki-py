[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "triki"
version = "0.2.0"
description = "Python library for the Triki bottle-cap motion controller: BLE connection, orientation tracking and gestures."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "witw2" }]
keywords = ["triki", "ble", "bluetooth", "imu", "gyroscope", "accelerometer", "controller", "gestures"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware",
]
dependencies = ["bleak>=0.20"]

[project.optional-dependencies]
windows = ["comtypes>=1.2; sys_platform == 'win32'"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/witw2/triki-py"
Issues = "https://github.com/witw2/triki-py/issues"

[project.scripts]
triki = "triki.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/triki"]

[tool.pytest.ini_options]
testpaths = ["tests"]
